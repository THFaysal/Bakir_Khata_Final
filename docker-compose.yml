services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bakir_khata
      MYSQL_USER: bakir
      MYSQL_PASSWORD: local-demo-password
      MYSQL_ROOT_PASSWORD: local-root-only
      TZ: Asia/Dhaka
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_data:/data/db
volumes:
  mysql_data:
  mongo_data:
