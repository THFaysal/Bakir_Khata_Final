<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Coordinators')}"></head><body class="app-body"><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar('Coordinators & Salary')}"></div><div th:replace="~{fragments/toast :: toast}"></div><main class="page"><section class="card"><div class="card__body"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Monthly Salary</th><th>Approved</th><th>Actions</th></tr></thead><tbody>
<tr th:each="c:${coordinators}"><td th:text="${c.userName}"></td><td th:text="${c.userEmail}"></td><td><span class="badge" th:classappend="${c.active}?'badge--success':'badge--gray'" th:text="${c.active?'ACTIVE':'REVOKED'}"></span></td><td><form th:if="${c.active}" th:action="@{/admin/coordinators/{id}/salary(id=${c.id})}" method="post" class="table-actions"><input name="amount" type="number" min="0" step="0.01" class="form-control form-control--salary" th:value="${c.monthlySalary}"><button class="btn btn--sm btn--secondary">Save</button></form><span th:unless="${c.active}" th:text="${c.monthlySalary}"></span></td><td th:text="${#temporals.format(c.approvedAt,'dd MMM yyyy')}"></td><td class="table-actions"><form th:if="${c.active}" th:action="@{/admin/coordinators/{id}/pay-salary(id=${c.id})}" method="post"><input name="month" type="month" class="form-control"><button class="btn btn--sm btn--primary">Pay salary</button></form><form th:if="${c.active}" th:action="@{/admin/coordinators/{id}/revoke(id=${c.id})}" method="post" onsubmit="return confirm('Revoke coordinator access? The user account and financial history will remain.')"><button class="btn btn--sm btn--danger">Revoke</button></form></td></tr>
<tr th:if="${#lists.isEmpty(coordinators)}"><td colspan="6">No coordinators yet.</td></tr></tbody></table></div></div></section></main></div></div><script th:src="@{/js/main.js}"></script></body></html>
