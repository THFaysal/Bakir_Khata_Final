<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Community moderation')}"></head><body class="app-body"><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar('moderation')}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar('Reported broadcasts')}"></div><main class="page page--module"><div th:replace="~{fragments/toast :: toast}"></div><div class="card" th:each="r:${reports}"><div class="card__body"><p th:text="|Report #${r.id} on broadcast #${r.broadcast.id}|">Report</p><p th:text="${r.reason}">Reason</p><p th:text="${r.broadcast.description}">Broadcast</p><form th:action="@{/moderation/reports/{id}(id=${r.id})}" method="post"><button class="btn btn--danger" name="hide" value="true">Hide broadcast</button><button class="btn btn--secondary" name="hide" value="false">Dismiss</button></form></div></div><p th:if="${#lists.isEmpty(reports)}">No pending reports.</p></main></div></div><script th:src="@{/js/main.js}"></script></body></html>
