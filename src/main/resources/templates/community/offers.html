<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Lending offers')}"></head><body class="app-body"><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar('community')}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar('Offers received')}"></div><main class="page page--module"><div th:replace="~{fragments/toast :: toast}"></div><h2>Offers from community members</h2><div class="card" th:each="o:${offers}"><div class="card__body"><p th:text="|Offer #${o.id} · ${o.amount} BDT · ${o.status}|">Offer</p><p th:text="${o.note}"></p><form th:if="${o.status.name()=='PENDING'}" th:action="@{/community/offers/{id}/accept(id=${o.id})}" method="post"><button class="btn btn--primary">Accept and request lender confirmation</button></form></div></div><a th:href="@{/community}">Back to community</a></main></div></div><script th:src="@{/js/main.js}"></script></body></html>
