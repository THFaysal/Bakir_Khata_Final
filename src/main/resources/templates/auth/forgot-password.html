<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Recover password')}"></head><body><main style="max-width:540px;margin:12vh auto;padding:24px"><div th:replace="~{fragments/toast :: toast}"></div><h1>Recover your password</h1><p>Enter your registered email address. A reset link is valid for 15 minutes.</p><form th:action="@{/forgot-password}" method="post" class="form"><label>Email <input name="email" type="email" autocomplete="email" required maxlength="150"></label><button class="btn btn--primary">Request reset link</button></form><p><a th:href="@{/login}">Back to login</a></p></main></body></html>
