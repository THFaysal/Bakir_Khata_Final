<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Set new password')}"></head><body><main style="max-width:540px;margin:12vh auto;padding:24px"><div th:replace="~{fragments/toast :: toast}"></div><h1>Set a new password</h1><form th:action="@{/reset-password}" method="post" class="form"><input type="hidden" name="token" th:value="${token}"><label>New password <input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><label>Confirm password <input name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><button class="btn btn--primary">Reset password</button></form></main></body></html>
