<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Notifications')}"></head><body class="app-body"><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar('notifications')}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar('Notifications')}"></div><div th:replace="~{fragments/toast :: toast}"></div><main class="page"><section class="card"><div class="card__header"><div><h3>Notification center</h3><p class="empty-state__desc">Persistent history for payment confirmations, coordinator decisions and other system events.</p></div></div><div class="card__body"><div th:if="${#lists.isEmpty(notifications)}" class="empty-state"><i class="bi bi-bell-slash"></i><p class="empty-state__title">No notifications yet</p></div><div class="mini-list" th:unless="${#lists.isEmpty(notifications)}"><div class="mini-list__item" th:each="n:${notifications}"><div class="mini-list__link"><div><span class="badge" th:classappend="${n.read}?'badge--gray':'badge--info'" th:text="${n.type}">TYPE</span><span class="mini-list__title" th:text="${n.message}">Message</span><span class="mini-list__sub" th:text="${#temporals.format(n.createdAt,'dd MMM yyyy HH:mm')}">Date</span></div><div class="table-actions"><form th:if="${n.actionable}" th:action="@{/transactions/{id}/reject(id=${n.relatedTransactionId})}" method="post"><button class="btn btn--sm btn--danger">Reject</button></form><form th:if="${n.actionable}" th:action="@{/transactions/{id}/accept(id=${n.relatedTransactionId})}" method="post"><button class="btn btn--sm btn--primary">Accept cash</button></form><form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="btn btn--sm btn--secondary">Mark read</button></form></div></div></div></div></div></section></main></div></div><script th:src="@{/js/main.js}"></script></body></html>
