<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/head :: head('User Management')}"></head>
<body class="app-body"><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar('users')}"></div><div class="app-main"><div th:replace="~{fragments/topbar :: topbar('User Management')}"></div><div th:replace="~{fragments/toast :: toast}"></div>
<main class="page"><section class="dashboard-grid dashboard-grid--management">
<div class="card"><div class="card__header"><h3>Users</h3><span class="badge badge--gray" th:text="${users.size()+' accounts'}"></span></div><div class="card__body"><div class="table-wrap"><table><thead><tr><th>User</th><th>Phone</th><th>Verified</th><th>Joined</th><th>Role</th><th>Status</th><th sec:authorize="hasRole('ADMIN')">Coordinator</th><th>Action</th></tr></thead><tbody>
<tr th:each="u:${users}" th:if="${currentUser.role.name()=='ADMIN' or u.role.name()=='USER'}"><td><div class="table-person"><span class="table-person__avatar" th:text="${#strings.substring(u.name,0,1)}">U</span><div><strong th:text="${u.name}"></strong><small th:text="${u.email}"></small></div></div></td><td th:text="${u.phone}"></td><td><span class="badge" th:classappend="${u.phoneVerified}?'badge--success':'badge--gray'" th:text="${u.phoneVerified}?'PHONE VERIFIED':'UNVERIFIED'"></span></td><td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td><td th:text="${u.role}"></td><td><span class="badge" th:classappend="${u.accountStatus.name()=='ACTIVE'}?'badge--success':'badge--danger'" th:text="${u.accountStatus}"></span></td>
<td sec:authorize="hasRole('ADMIN')"><form th:if="${u.role.name()=='USER'}" th:action="@{/admin/users/{id}/eligibility(id=${u.id})}" method="post"><input type="hidden" name="eligible" th:value="${!u.coordinatorEligible}"><button class="btn btn--sm" th:classappend="${u.coordinatorEligible}?'btn--danger':'btn--secondary'" th:text="${u.coordinatorEligible}?'Remove eligibility':'Make eligible'"></button></form><span th:unless="${u.role.name()=='USER'}">—</span></td>
<td><form th:if="${u.role.name()=='USER' and u.id != currentUser.id}" th:action="@{/management/users/{id}/status(id=${u.id})}" method="post"><input type="hidden" name="status" th:value="${u.accountStatus.name()=='ACTIVE'?'SUSPENDED':'ACTIVE'}"><button class="btn btn--sm" th:classappend="${u.accountStatus.name()=='ACTIVE'}?'btn--danger':'btn--primary'" th:text="${u.accountStatus.name()=='ACTIVE'}?'Suspend':'Reactivate'"></button></form></td></tr>
</tbody></table></div></div></div>
<div class="card"><div class="card__header"><h3>Add user</h3></div><div class="card__body"><form th:action="@{/management/users/create}" th:object="${registrationDTO}" method="post" class="form">
<div class="form-group"><label>Name</label><input th:field="*{name}" class="form-control" required><span class="form-error" th:errors="*{name}"></span></div>
<div class="form-group"><label>Email</label><input type="email" th:field="*{email}" class="form-control" required><span class="form-error" th:errors="*{email}"></span></div>
<div class="form-group"><label>Phone</label><input type="tel" th:field="*{phone}" class="form-control" required><span class="form-error" th:errors="*{phone}"></span></div>
<div class="form-group"><label>Password</label><input type="password" th:field="*{password}" class="form-control" minlength="6" required></div>
<div class="form-group"><label>Confirm password</label><input type="password" th:field="*{confirmPassword}" class="form-control" required><span class="form-error" th:errors="*{confirmPassword}"></span></div>
<button class="btn btn--primary" type="submit">Create user</button></form></div></div>
</section></main></div></div><script th:src="@{/js/main.js}"></script></body></html>
