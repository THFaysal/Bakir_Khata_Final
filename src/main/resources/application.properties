spring.application.name=Bakir Khata
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.mongodb.uri=${MONGODB_URI:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SECURE_COOKIE:}
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=${APP_JWT_ISSUER:}
app.verify.email.mode=${EMAIL_MODE:}
app.verify.email.from=${EMAIL_FROM:}
app.verify.email.resend-key=${RESEND_API_KEY:}
app.otp.mode=${OTP_MODE:demo}
app.otp.fallback-to-demo=${OTP_FALLBACK_TO_DEMO:}
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=12
app.payments.mode=${PAYMENT_MODE:demo}
app.payments.sslcommerz.store-id=${SSLCOMMERZ_SANDBOX_STORE_ID:}
app.payments.sslcommerz.store-password=${SSLCOMMERZ_SANDBOX_STORE_PASSWORD:}
app.payments.public-base-url=${APP_PUBLIC_BASE_URL:}
app.finance.service-fee-rate=0.04
app.finance.daily-overdue-rate=0.005
app.finance.max-penalty-rate=0.20
app.finance.platform-penalty-share=0.20

spring.data.mongodb.auto-index-creation=true

app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin-phone=${APP_ADMIN_PHONE:}


app.receipts.signing-secret=${APP_RECEIPT_SECRET:}
app.receipts.public-base-url=${APP_PUBLIC_BASE_URL:}

