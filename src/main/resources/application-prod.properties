spring.thymeleaf.cache=true
# For a first-time demonstration database, Hibernate creates the new community tables.
# Replace with versioned Flyway migrations before handling non-demo financial data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
server.servlet.session.cookie.secure=true
app.verify.email.mode=${EMAIL_MODE:resend}
app.otp.mode=${OTP_MODE:twilio}
app.otp.fallback-to-demo=false
app.payments.mode=${PAYMENT_MODE:sandbox}
